# 情绪脑电 GCN 训练管线全局配置

paths:
  data_dir: "data/02_pure_features"          # 指向 run_pipeline.py 输出目录
  checkpoint_dir: "data/05_checkpoints"
  log_dir: "logs"

seed: 42

eeg_semantics:
  num_channels: 62
  num_classes: 3
  fs: 200
  band_indices:
    delta: [1, 2]
    theta: [1, 3]
    alpha: [2, 4]
    beta: [3, 8]
    gamma: [7, 12]

model:
  type: "EEG_DGCN"
  hidden_channels: 64
  dropout_rate: 0.5

train:
  batch_size: 128
  epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0005
  early_stopping_patience: 20

task_aware:
  lambda_artinv: 0.2
