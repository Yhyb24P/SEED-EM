# 情绪脑电 GCN 训练管线全局配置

paths:
  data_dir: "data/02_pure_features"                  # 存放 S1~S15.mat 纯净数据与 label.mat 的目录
  checkpoint_dir: "data/05_checkpoints"     # 模型权重落盘目录
  log_dir: "logs"                   # TensorBoard 追踪目录

eeg_semantics:
  num_channels: 16
  num_classes: 3                    # 0: 消极, 1: 中性, 2: 积极
  fs: 200
  # STFT 张量映射为 DE 的基准频段
  band_indices:
    delta: [1, 2]   # 1-4 Hz
    theta: [1, 3]   # 4-8 Hz
    alpha: [2, 4]   # 8-13 Hz
    beta:  [3, 8]   # 13-30 Hz
    gamma: [7, 12]  # 30-45 Hz

model:
  type: "EEG_DGCN"                   # 可选: EEG_GCN, EEG_DGCN
  hidden_channels: 64
  dropout_rate: 0.5

train:
  batch_size: 128                   # 对应 128 秒的切片组合
  epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0005              # 抑制 GCN 过拟合节点噪声
  early_stopping_patience: 20       # 基于验证集 F1 阻断过拟合

seed: 42

phase_a:
  batch_size: 4
  epochs_a2: 10
  epochs_a3: 20
  temporal_window: 3
  edge_threshold: 0.3
  drop_initial_bins: 20
  lambda_sparse: 0.1
  lambda_smooth: 0.05
  lambda_anticheat: 0.5

